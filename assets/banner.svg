<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#24243e"/>
      <stop offset="100%" stop-color="#302b63"/>
    </linearGradient>

    <!-- Animated Neon Gradient -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#00f2fe" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#9b51e0">
        <animate attributeName="stop-color" values="#9b51e0;#f71068;#9b51e0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff0844">
        <animate attributeName="stop-color" values="#ff0844;#ffb199;#ff0844" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Pulsing Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rect with Pattern -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="150" cy="90" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="120;160;120" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="270" r="160" fill="#ff0844" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="140;180;140" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Data Connection Beams -->
  <path d="M 100 280 Q 300 200 500 280 T 900 280 T 1100 120" fill="none" stroke="url(#neon-glow)" stroke-width="2" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,600;300,300;600,0" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Header Title Tag / Icon -->
  <g transform="translate(80, 75)">
    <!-- Animated Pulse Indicator -->
    <circle cx="18" cy="18" r="8" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="24" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">CURATED ADTECH ECOSYSTEM</text>
  </g>

  <!-- Main Banner Title -->
  <text x="80" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="1">
    Awesome Programmatic Advertising
  </text>
  
  <text x="80" y="195" fill="url(#neon-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" filter="url(#glow)">
    Demand-Side Platforms &amp; RTB Engine Stacks
  </text>

  <!-- Subtitle / Tagline -->
  <text x="80" y="245" fill="#a0aec0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
    The premier resource for DSPs, OpenRTB Bidders, Header Bidding, and Ad Serving Tech.
  </text>

  <!-- Dynamic Feature Badges at Bottom -->
  <g transform="translate(80, 280)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1"/>
    <text x="80" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📡 OpenRTB 2.x / 3.0</text>
    
    <!-- Badge 2 -->
    <rect x="175" y="0" width="150" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(155, 81, 224, 0.4)" stroke-width="1"/>
    <text x="250" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎯 Enterprise DSPs</text>

    <!-- Badge 3 -->
    <rect x="340" y="0" width="165" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 8, 68, 0.4)" stroke-width="1"/>
    <text x="422" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Real-Time Bidding</text>
  </g>
</svg>
